name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Icon & Build EXE
      run: |
        python -c "from main import generate_app_icon; generate_app_icon()"
        pyinstaller --noconsole --onefile --icon=icon.ico --name "Notes Hamza" main.py

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: Notes-Hamza-Windows
        path: dist/Notes Hamza.exe
